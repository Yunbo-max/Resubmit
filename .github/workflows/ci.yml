name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install isolated demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures
          python -m pip install -r requirements-qa.txt -r requirements-demo.txt
      - run: python tests/check_latex_native.py --out build/native-ci
      - run: python scripts/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-site-preview
          path: site/
          retention-days: 14
