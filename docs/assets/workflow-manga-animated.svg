<title id="ft">How ReSubmit works — six linked stages</title>
<desc id="fd">A numbered, animated, illustrated flowchart from the user's paper and review history to scientific discipline checks, official venue verification, host-LLM recommendations, source LaTeX changes and inspected PDF delivery. This is not a live agent run.</desc>
