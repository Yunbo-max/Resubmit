<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" role="img" aria-labelledby="ttl ds">
<title id="ttl">ReSubmit — an illustrated introduction</title>
<desc id="ds">Manga-inspired university researcher beside paper drafts and a laptop. ReSubmit helps an existing AI agent select a conference, incorporate reviews, revise source LaTeX and check a PDF. This is a conceptual illustration, not a live application.</desc>
<defs>
 <linearGradient id="paperbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfbf6"/><stop offset=".57" stop-color="#f0f6ed"/><stop offset="1" stop-color="#e2eee4"/></linearGradient>
 <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#799f83"/><stop offset="1" stop-color="#315f50"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#ffe4c8"/><stop offset="1" stop-color="#eeb79d"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#705044"/><stop offset="1" stop-color="#312c32"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#2e493a" flood-opacity=".17"/></filter>
 <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="21"/></filter>
</defs>
<style>
  .title{font-family:Georgia,serif;fill:#12392e}
  .sans{font-family:Arial,Helvetica,sans-serif}
  .ink{stroke:#3f4542;stroke-linejoin:round;stroke-linecap:round}
  .paperfloat{animation:float 5.5s ease-in-out infinite;transform-origin:1105px 315px}
  .stars{animation:shine 3.2s ease-in-out infinite;transform-origin:center}
  .star2{animation:shine 3.2s 1.4s ease-in-out infinite}
  .plane{animation:glide 5.2s ease-in-out infinite;transform-origin:690px 170px}
  .blink{animation:blink 7s ease-in-out infinite;transform-origin:center}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(.75deg)}}
  @keyframes shine{0%,100%{opacity:.42;transform:scale(.84)}50%{opacity:1;transform:scale(1.12)}}
  @keyframes glide{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-9px)}}
  @keyframes blink{0%,94%,98%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  @media(prefers-reduced-motion:reduce){.paperfloat,.stars,.star2,.plane,.blink{animation:none!important}}
</style>
<rect x="1.5" y="1.5" width="1437" height="757" rx="25" fill="url(#paperbg)" stroke="#c6decf" stroke-width="2"/>
<rect width="1440" height="8" rx="4" fill="#174b3b"/>
<!-- subtle botanical background -->
<path d="M1425 120 Q1350 170 1390 300 M1380 190 Q1315 128 1250 162 M1392 250 Q1462 200 1431 154" fill="none" stroke="#b3d0b8" stroke-width="4" opacity=".55"/>
<ellipse cx="1160" cy="687" rx="354" ry="40" fill="#bad1bf" opacity=".25" filter="url(#soft)"/>
<g class="sans" fill="#286049">
 <circle cx="78" cy="48" r="6" fill="#208959"/><text x="95" y="53" font-size="15" font-weight="700" letter-spacing="3.1">OPEN-SOURCE RESEARCH AGENT SKILLS</text>
</g>
<text x="76" y="202" class="title" font-size="121" letter-spacing="-6">Re<tspan fill="#187e54">Submit</tspan></text>
<g class="plane"><path d="M674 91 L736 72 L705 143 L694 113 Z" fill="#daedda" stroke="#246449" stroke-width="4" stroke-linejoin="round"/><path d="M694 113 L736 72 L684 103" fill="none" stroke="#246449" stroke-width="4"/></g>
<path d="M85 223 C248 250 422 240 605 215" fill="none" stroke="#92bba5" stroke-width="4" stroke-linecap="round"/>
<text x="78" y="285" class="title" font-size="39">Find the right venue.</text>
<text x="78" y="337" class="title" font-size="39">Keep the science. <tspan font-style="italic" fill="#1b825b">Fix the paper.</tspan></text>
<text x="80" y="389" class="sans" fill="#5b6b61" font-size="23">From reviewer feedback to your next submission.</text>
<text x="80" y="422" class="sans" fill="#5b6b61" font-size="23">Powered by the agent you already use.</text>
<!-- intro features -->
<g class="sans" font-weight="600" font-size="21">
 <g transform="translate(83 468)"><rect width="304" height="51" rx="25" fill="#fff" stroke="#c8ddd0"/><circle cx="28" cy="25" r="14" fill="#d5eddb"/><path d="M22 25 l5 5 l10 -12" stroke="#257850" stroke-width="3.4" fill="none"/><text x="54" y="32" fill="#335347">Venue + deadline checks</text></g>
 <g transform="translate(83 530)"><rect width="304" height="51" rx="25" fill="#fff" stroke="#c8ddd0"/><circle cx="28" cy="25" r="14" fill="#d5eddb"/><path d="M22 25 l5 5 l10 -12" stroke="#257850" stroke-width="3.4" fill="none"/><text x="54" y="32" fill="#335347">Rebuttal-aware revision</text></g>
 <g transform="translate(83 592)"><rect width="304" height="51" rx="25" fill="#fff" stroke="#c8ddd0"/><circle cx="28" cy="25" r="14" fill="#d5eddb"/><path d="M22 25 l5 5 l10 -12" stroke="#257850" stroke-width="3.4" fill="none"/><text x="54" y="32" fill="#335347">LaTeX + PDF inspection</text></g>
</g>
<text x="85" y="703" class="sans" fill="#778c79" font-size="15" letter-spacing="1.5">TWO FOCUSED SKILLS   •   NO MODEL TRAINING   •   AUTHOR-IN-CONTROL</text>
<!-- magazine manga desk composition -->
<g transform="translate(746 25)">
 <g opacity=".62" transform="rotate(-8 405 365)"><rect x="204" y="100" width="411" height="510" rx="19" fill="#dae9dc" stroke="#a9cdb5" stroke-width="3"/></g>
