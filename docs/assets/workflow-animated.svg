<rect x="70" y="655" width="1300" height="123" rx="19" fill="#194f3b"/>
<g class="phase phase0" opacity="1">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">01 — INSPECT THE RESEARCH</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">Read the actual draft, verified results and previous author-visible reviews.</text></g>
<g class="phase phase1" opacity="0">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">02 — ROUTE BY RESEARCH FIELD</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">Apply ML, NLP, biomedical, chemistry or systems evidence norms as relevant.</text></g>
<g class="phase phase2" opacity="0">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">03 — VERIFY HARD CONSTRAINTS</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">Check official rank sources, current CFP, track, stage and timezone.</text></g>
<g class="phase phase3" opacity="0">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">04 — MAKE A PAPER-AWARE DECISION</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">The existing agent compares fit, evidence maturity, risks and revision cost.</text></g>
<g class="phase phase4" opacity="0">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">05 — REVISE WHAT NEEDS REVISION</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">Update rebuttal evidence, native tables and figures; migrate LaTeX safely.</text></g>
<g class="phase phase5" opacity="0">
<text x="116" y="706" fill="#bdeacb" font-weight="700" font-size="18" letter-spacing="2">06 — VALIDATE THE DELIVERABLE</text>
<text x="116" y="747" fill="#fffdf5" font-size="21">Compile, inspect counted pages and source changes; author approves release.</text></g>
<text x="1365" y="796" text-anchor="end" font-size="12" fill="#547064">SCHEMATIC · NO LIVE DEADLINES · NO ACCEPTANCE GUARANTEE</text>
</svg>